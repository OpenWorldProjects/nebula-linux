[package]
name = "nebula"
version = "0.1.0"
edition = "2021"
description = "Nebula: a game launcher for Linux with real GOG cloud save sync"
build = "build.rs"

[dependencies]
slint = { version = "~1.18", default-features = false, features = ["std", "backend-winit", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
sha1 = "0.10"
hex = "0.4"
walkdir = "2"
dirs = "5"
wry = "0.57.1"
tao = "0.37.2"
ksni = "0.3.7"
urlencoding = "2.1.3"
flate2 = "1.0"

[build-dependencies]
slint-build = "1"

[profile.release]
lto = true
strip = true
opt-level = "s"

# Keep dev builds small: debug info only for our own crate, none for dependencies.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
